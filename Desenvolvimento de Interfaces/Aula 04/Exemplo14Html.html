<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 14 = HTML</title>
</head>
<body>
    <form action="paginaDestino.aspx" method="get">
        <fieldset>
            <legend>Cadastro</legend>
            <fieldset>
                <legend>Dados Pessoais</legend>
                <div>
                    <label for="">CPF</label><br>
                    <input type="text" name="txtCPF" id="txtCPF" required>
                </div>
                <br>
                <div>
                    <label for="">Nome</label><br>
                    <input type="text" name="txtNome" id="txtNome" required maxlength="30">
                </div>
                <br>
                <div>
                    <label for="">Nome da Mãe</label><br>
                    <input type="text" name="txtNomeMae" id="txtNomeMae">
                </div>
                <br>
                <div>
                    <label for="">Nome do Pai</label><br>
                    <input type="text" name="txtNomePai" id="txtNomePai" autofocus>
                </div>
                <br>
                <div>
                    <label for="">Data de nascimento</label><br>
                    <input type="date" name="txtDataNascimento" id="txtDataNascimento" min="1901-01-01" max="2100-01-01">
                </div>
                <br>
                <div>
                    <label for="">Estado Civil</label><br>
                    <select name="cboEstadoCivil" id="cboEstadoCivil">
                        <option value="1">Casado</option>             
                        <option value="2">Solteiro</option>
                        <option value="3">Viúvo</option>
                        <option value="4">Divorciado</option>
                        <option value="5">Tico-Tico no fubá</option>
                        <option value="6">Outros</option>

                    </select>
                </div>
                <br>
                
            </fieldset>
            <fieldset>
                <legend>Preferências</legend>
                <div>
                    <label for="">Forma de trabalho Preferida</label><br>
                    <input type="checkbox" name="chkFormaTrabalho" id="chkFormaTrabalho" value="1">Home Office 
                    <input type="checkbox" name="chkFormaTrabalho"id="chkFormaTrabalho" value="2">Híbrido 
                    <input type="checkbox" name="chkFormaTrabalho" id="chkFormaTrabalho" value="3">Presencial 
                </div>
                <br>
                <div>
                    <label for="">Área de Interesse</label> <br>
                    <input type="radio" name="rdAreaInteresse" id="rdAreaInteresse" value="1">Desenvolvimento Back-end <br>
                    <input type="radio" name="rdAreaInteresse" id="rdAreaInteresse" value="2">Desenvolvimento Front-end <br>
                    <input type="radio" name="rdAreaInteresse" id="rdAreaInteresse" value="3">Desenvolvimento Full Stack <br>
                    <input type="radio" name="rdAreaInteresse" id="rdAreaInteresse" value="4">Engenharia de IA <br>
                </div>
                
            </fieldset>
            <button type="submit">Cadastrar</button><br>
            <button type="submit">Sair</button>
        </fieldset>   
    </form>
</body>
</html>
