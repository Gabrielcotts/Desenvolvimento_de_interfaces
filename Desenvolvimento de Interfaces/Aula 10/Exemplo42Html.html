<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 42 HTML CSS</title>
    <style>
        body {
            margin: 0;
        }

        .container {
            display: grid;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            grid-gap: 10px;
            grid-template-areas:
                "header header"
                "main aside"
                "footer footer";
            grid-template-columns: auto auto;
            grid-template-rows: 10% 1fr 10%;
            height: 98vh;
        }

        header, main, aside, footer {
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 2.5rem;
        }

        header {
            background-color: lightcoral;
            grid-area: header;

        }

        main {
            background-color: lightgreen;
            grid-area: main;
        }
        
        aside {
            background-color: deeppink;
            grid-area: aside;
        }
        
        footer {
            background-color: darkorange;
            grid-area: footer;
        }

    </style>
</head>

<body>
    <div class="container">
        <header>1</header>
        <main>2</main>
        <aside>3</aside>
        <footer>4</footer>
    </div>
</body>

</html>
