<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 61 - Bootstrap Dialog - Funcionário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">
    <div class="container text-center">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#estoqueDialog">Caixa de Edição do
            Estoque</button>
    </div>

    <div class="modal fade" id="estoqueDialog" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Estoque #2</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form>
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-md-2">
                                <label class="form-label">Id</label>
                                <input type="text" class="form-control bg-light" readonly value="2">
                            </div>
                            <div class="col-md-10">
                                <label class="form-label">Produto (ProdutoId) <span class="text-danger">*</span></label>
                                <select class="form-select" required>
                                    <option value="2" selected>2 - Monitor 27" IPS 144Hz Full HD</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Quantidade Atual <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" min="0" required value="4">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Estoque Mínimo <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" min="0" required value="5">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Estoque Máximo <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" min="0" required value="20">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Localização Física <small
                                        class="text-muted">(opcional)</small></label>
                                <input type="text" class="form-control" value="Corredor C - Pallet 01">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary"
                            data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar Configuração</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
