<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 63 - Bootstrap Dialog - Forma de Pagamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">
    <div class="container text-center">
        <button class="btn btn-success btn-lg" data-bs-toggle="modal" data-bs-target="#movimentacaoDialog">
           Registrar Movimentação de Estoque
        </button>
    </div>

    <div class="modal fade" id="movimentacaoDialog" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">Registrar Movimentação de Estoque</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form>
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-md-7">
                                <label class="form-label">Produto <span class="text-danger">*</span></label>
                                <select class="form-select" required>
                                    <option value="" selected disabled>Selecione o produto...</option>
                                    <option value="1">1 - Teclado Mecânico RGB Switch Brown</option>
                                    <option value="2">2 - Monitor 27" IPS 144Hz Full HD</option>
                                </select>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label">Tipo Movimentacao (enum) <span
                                        class="text-danger">*</span></label>
                                <select class="form-select" required>
                                    <option value="1" selected>1 - Entrada</option>
                                    <option value="2">2 - Saída</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Quantidade <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" min="1" required value="10">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Qtd. Anterior (auto)</label>
                                <input type="number" class="form-control bg-light" readonly value="4">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Nova Qtd. Atual (auto)</label>
                                <input type="number" class="form-control bg-light" readonly value="14">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary"
                            data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success">Confirmar Movimentação</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
