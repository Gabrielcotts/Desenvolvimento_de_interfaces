<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 57 - Fornecedor Dialog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">
    <div class="container text-center">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#fornecedorDialog">Caixa de Edição do
            Fornecedor</button>
    </div>

    <div class="modal fade" id="fornecedorDialog" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Fornecedor #1</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form>
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-md-2">
                                <label class="form-label">Id</label>
                                <input type="text" class="form-control bg-light" readonly value="1">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Razão Social <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" required value="TechBrasil Distribuidora Ltda">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">CNPJ <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" required value="12.345.678/0001-90">
                            </div>
                            <div class="col-md-5">
                                <label class="form-label">E-mail <small class="text-muted">(opcional)</small></label>
                                <input type="email" class="form-control" value="vendas@techbrasil.com.br">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Telefone <small class="text-muted">(opcional)</small></label>
                                <input type="text" class="form-control" value="(61) 3344-5566">
                            </div>
                            <div class="col-md-3 d-flex align-items-end">
                                <div class="form-check form-switch mb-2">
                                    <input class="form-check-input" type="checkbox" id="fornAtivo" checked>
                                    <label class="form-check-label" for="fornAtivo">Ativo</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary"
                            data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
