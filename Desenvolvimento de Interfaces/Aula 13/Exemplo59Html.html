<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 59 - Produto Dialog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">
    <div class="container text-center">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#produtoDialog">Caixa de Edição do
            Produto</button>
    </div>

    <div class="modal fade" id="produtoDialog" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Produto #1</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form>
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-md-2">
                                <label class="form-label">Id</label>
                                <input type="text" class="form-control bg-light" readonly value="1">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Nome do Produto <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" required
                                    value="Teclado Mecânico RGB Switch Brown">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Código de Barras <small
                                        class="text-muted">(opcional)</small></label>
                                <input type="text" class="form-control" value="7898541200112">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Categoria (CategoriaId) <span
                                        class="text-danger">*</span></label>
                                <select class="form-select" required>
                                    <option value="1" selected>1 - Periféricos</option>
                                    <option value="2">2 - Monitores</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Fornecedor (FornecedorId) <span
                                        class="text-danger">*</span></label>
                                <select class="form-select" required>
                                    <option value="1" selected>1 - TechBrasil Distribuidora Ltda</option>
                                    <option value="2">2 - InfoSul Suprimentos S.A.</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Preço Unitário <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text">R$</span>
                                    <input type="number" step="0.01" class="form-control" required value="349.90">
                                </div>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label">Data Cadastro</label>
                                <input type="text" class="form-control bg-light" readonly value="10/11/2026 09:30">
                            </div>
                            <div class="col-md-3 d-flex align-items-end">
                                <div class="form-check form-switch mb-2">
                                    <input class="form-check-input" type="checkbox" id="prodAtivo" checked>
                                    <label class="form-check-label" for="prodAtivo">Ativo</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary"
                            data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
